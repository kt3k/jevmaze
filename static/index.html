<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Maze</title>
    <meta name="description"
      content="TypeSafe の System One モデル Jev に、周囲の情報だけを与えて 2D 迷路を解かせるシミュレーション" />
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%272%27 y=%272%27 width=%2728%27 height=%2728%27 rx=%274%27 fill=%27%23111%27/%3E%3Cpath d=%27M8 8h16M8 8v16M16 8v10M24 14v10M8 24h8%27 stroke=%27%23fff%27 stroke-width=%273%27 fill=%27none%27/%3E%3Ccircle cx=%2721%27 cy=%2721%27 r=%273.5%27 fill=%27%23f97316%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
    try {
      if (matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    } catch (_) {}
    </script>
  </head>
  <body class="min-h-screen">
    <header class="border-b">
      <div
        class="mx-auto max-w-7xl px-4 py-4">
        <div>
          <h1 class="text-xl font-semibold tracking-tight">Jev Maze</h1>
          <p class="text-sm text-muted-foreground"
            data-i18n-html="header.desc"></p>
        </div>
      </div>
    </header>

    <main
      class="mx-auto grid max-w-7xl gap-4 px-4 py-4 lg:grid-cols-[320px_minmax(0,1fr)]">
      <aside class="flex flex-col gap-4">
        <div class="card" data-size="sm">
          <header>
            <h2 data-i18n="run.title"></h2>
          </header>
          <section class="flex flex-col gap-3">
            <div class="field">
              <label
                for="delay"><span data-i18n="run.delay"></span> <span id="delayValue" class="text-muted-foreground">200ms</span></label>
              <input id="delay" type="range" class="input" min="0" max="2000"
                step="50" value="200" />
            </div>
            <div class="field">
              <label for="maxSteps" data-i18n="run.maxSteps"></label>
              <input id="maxSteps" type="number" class="input" min="1" step="1"
                value="1000" />
            </div>
            <label class="field"
              data-orientation="horizontal"><input type="checkbox" role="switch" class="input" id="showPath" /><span data-i18n="run.showPath"></span></label>
            <div class="grid grid-cols-3 gap-2">
              <button id="run" type="button" class="btn"></button>
              <button id="stepBtn" type="button" class="btn"
                data-variant="outline" data-i18n="run.step"></button>
              <button id="reset" type="button" class="btn"
                data-variant="outline" data-i18n="run.reset"></button>
            </div>
          </section>
        </div>
        <div class="card" data-size="sm">
          <header>
            <h2 data-i18n="maze.title"></h2>
            <p data-i18n="maze.desc"></p>
          </header>
          <section class="flex flex-col gap-3">
            <div class="grid grid-cols-2 gap-3">
              <div class="field">
                <label for="width" data-i18n="maze.width"></label>
                <select id="width" class="select"></select>
              </div>
              <div class="field">
                <label for="height" data-i18n="maze.height"></label>
                <select id="height" class="select"></select>
              </div>
            </div>
            <div class="field">
              <label for="seed" data-i18n="maze.seed"></label>
              <div class="flex gap-2">
                <input id="seed" type="number" class="input min-w-0 flex-1"
                  min="0" step="1" />
                <button id="randomSeed" type="button" class="btn"
                  data-variant="outline"
                  data-i18n-title="maze.randomSeed">🎲</button>
              </div>
            </div>
            <div class="field">
              <label
                for="braid"><span data-i18n="maze.braid"></span> <span id="braidValue" class="text-muted-foreground">0%</span></label>
              <input id="braid" type="range" class="input" min="0" max="100"
                step="5" value="0" />
              <p
                class="text-xs text-muted-foreground"
                data-i18n="maze.braidHelp"></p>
            </div>
            <button id="newMaze" type="button" class="btn w-full"
              data-variant="secondary" data-i18n="maze.new"></button>
          </section>
        </div>

        <div class="card" data-size="sm">
          <header>
            <h2 data-i18n="info.title"></h2>
            <p data-i18n="info.desc"></p>
          </header>
          <section class="flex flex-col gap-2" id="infoOptions">
            <label class="field"
              data-orientation="horizontal"><input type="checkbox" role="switch" class="input" id="info-visibleCells" checked /><span data-i18n="info.visibleCells"></span></label>
            <label class="field"
              data-orientation="horizontal"><input type="checkbox" role="switch" class="input" id="info-visits" checked /><span data-i18n="info.visits"></span></label>
            <label class="field"
              data-orientation="horizontal"><input type="checkbox" role="switch" class="input" id="info-lastMove" checked /><span data-i18n="info.lastMove"></span></label>
            <label class="field"
              data-orientation="horizontal"><input type="checkbox" role="switch" class="input" id="info-currentVisits" checked /><span data-i18n="info.currentVisits"></span></label>
            <label class="field"
              data-orientation="horizontal"><input type="checkbox" role="switch" class="input" id="info-stepsTaken" /><span data-i18n="info.stepsTaken"></span></label>
            <label class="field"
              data-orientation="horizontal"><input type="checkbox" role="switch" class="input" id="info-exitHint" /><span data-i18n="info.exitHint"></span></label>
            <div class="field mt-2">
              <label for="instructions" data-i18n="info.instructions"></label>
              <textarea id="instructions" class="textarea" rows="5"></textarea>
            </div>
            <div class="field">
              <label for="model" data-i18n="info.model"></label>
              <input id="model" type="text" class="input" value="jev-latest" />
            </div>
          </section>
        </div>
        <div class="card" data-size="sm">
          <section>
            <div class="field">
              <label for="lang" data-i18n="lang.label"></label>
              <select id="lang" class="select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
              </select>
            </div>
          </section>
        </div>
      </aside>

      <div class="flex min-w-0 flex-col gap-4">
        <div id="errorBox" class="alert hidden" role="alert"
          data-variant="destructive">
          <h2 data-i18n="error.title"></h2>
          <section id="errorText"></section>
        </div>

        <div class="card" data-size="sm">
          <section class="overflow-x-auto">
            <div id="canvasWrap" class="w-full">
              <canvas id="maze"
                class="mx-auto block bg-white"></canvas>
            </div>
            <p class="mt-2 text-xs text-muted-foreground"
              data-i18n="legend"></p>
          </section>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div class="card" data-size="sm">
            <header>
              <h2 data-i18n="stats.title"></h2>
            </header>
            <section>
              <dl id="stats"
                class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-sm"></dl>
            </section>
          </div>
          <div class="card" data-size="sm">
            <header>
              <h2 data-i18n="decision.title"></h2>
              <p id="decisionMeta"
                class="text-muted-foreground"></p>
            </header>
            <section class="flex flex-col gap-2">
              <div id="probs" class="flex flex-col gap-1"></div>
            </section>
          </div>
        </div>

        <div class="card" data-size="sm">
          <header>
            <h2 data-i18n="history.title"></h2>
            <p data-i18n="history.desc"></p>
          </header>
          <section class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>#</th>
                  <th data-i18n="history.maze"></th>
                  <th data-i18n="history.braid"></th>
                  <th data-i18n="history.info"></th>
                  <th data-i18n="history.result"></th>
                  <th class="text-right" data-i18n="history.steps"></th>
                  <th class="text-right" data-i18n="history.shortest"></th>
                  <th class="text-right" data-i18n="history.ratio"></th>
                  <th class="text-right" data-i18n="history.api"></th>
                  <th class="text-right" data-i18n="history.latency"></th>
                  <th class="text-right" data-i18n="history.time"></th>
                </tr>
              </thead>
              <tbody id="historyBody"></tbody>
            </table>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
